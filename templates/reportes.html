<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Gestión - Cooperativa Reducto Ltda.</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .contenedor {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        .cabecera {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .cabecera h1 {
            font-size: 1.7rem;
            margin: 0;
        }

        .cabecera__logo {
            height: 56px;
            width: auto;
        }

        .cabecera__acciones {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filtros {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            gap: 14px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .campo label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .campo input,
        .campo select {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: var(--bg-card-hover);
            color: white;
            font-size: 0.95rem;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn--primary {
            background: var(--primary);
            color: #05301c;
        }

        .btn--ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--text-secondary);
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }

        .kpi {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px 20px;
            border-left: 5px solid var(--primary);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .kpi__valor {
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .kpi__etiqueta {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .kpi__nota {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .panel h2 {
            font-size: 1.15rem;
            margin: 0 0 16px;
        }

        .grilla-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 22px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        th {
            text-align: left;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td.num,
        th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .punto {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        /* Barras dibujadas con CSS: sin librerías externas */
        .barra-fila {
            display: grid;
            grid-template-columns: 64px 1fr 58px;
            align-items: center;
            gap: 10px;
            margin-bottom: 7px;
        }

        .barra-fila__etiqueta {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }

        .barra-fila__pista {
            background: rgba(0, 0, 0, 0.28);
            border-radius: 6px;
            height: 22px;
            overflow: hidden;
        }

        .barra-fila__valor {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--primary-dark), var(--primary-light));
            min-width: 2px;
            transition: width .4s ease;
        }

        .barra-fila__num {
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
        }

        .pico {
            background: linear-gradient(90deg, #d97706, #fbbf24) !important;
        }

        .vacio {
            color: var(--text-muted);
            text-align: center;
            padding: 30px;
        }

        .aviso {
            background: rgba(245, 158, 11, .12);
            border: 1px solid #f59e0b;
            color: #fde68a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: .9rem;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <header class="cabecera">
            {% if logo_url %}<img src="{{ logo_url }}" alt="" class="cabecera__logo">{% endif %}
            <div>
                <h1>Tablero de Gestión</h1>
                <p style="color: var(--text-secondary); margin: 2px 0 0; font-size: .9rem;">
                    Cooperativa Reducto Ltda.
                </p>
            </div>
            <div class="cabecera__acciones">
                <span style="color: var(--text-secondary); font-size: .9rem;">👤 {{ usuario.nombre }}</span>
                <a href="/admin" class="btn btn--ghost">← Volver</a>
            </div>
        </header>

        <div class="filtros">
            <div class="campo">
                <label for="desde">Desde</label>
                <input type="date" id="desde">
            </div>
            <div class="campo">
                <label for="hasta">Hasta</label>
                <input type="date" id="hasta">
            </div>
            <div class="campo">
                <label for="atajo">Período</label>
                <select id="atajo" onchange="aplicarAtajo(this.value)">
                    <option value="">Personalizado</option>
                    <option value="hoy">Hoy</option>
                    <option value="semana">Últimos 7 días</option>
                    <option value="mes" selected>Este mes</option>
                    <option value="mes_pasado">Mes pasado</option>
                    <option value="anio">Este año</option>
                </select>
            </div>
            <button class="btn btn--primary" onclick="cargar()">Actualizar</button>
            <a class="btn btn--ghost" id="btnExportar" href="#">⬇ Exportar a Excel</a>
        </div>

        <div id="avisoTruncado"></div>

        <div class="kpis" id="kpis"></div>

        <div class="panel">
            <h2>Turnos por hora del día</h2>
            <div id="porHora"></div>
        </div>

        <div class="grilla-2">
            <div class="panel">
                <h2>Por departamento</h2>
                <div id="porDepartamento"></div>
            </div>

            <div class="panel">
                <h2>Por día de la semana</h2>
                <div id="porDiaSemana"></div>
            </div>
        </div>

        <div class="panel">
            <h2>Productividad por puesto</h2>
            <div id="porOperador"></div>
        </div>
    </div>

    <script>
        const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

        function escapar(t) {
            const d = document.createElement('div');
            d.textContent = t == null ? '' : String(t);
            return d.innerHTML;
        }

        function iso(fecha) {
            // Fecha local en AAAA-MM-DD, sin pasar por UTC
            const p = n => String(n).padStart(2, '0');
            return `${fecha.getFullYear()}-${p(fecha.getMonth() + 1)}-${p(fecha.getDate())}`;
        }

        function aplicarAtajo(valor) {
            if (!valor) return;
            const hoy = new Date();
            let desde = new Date(hoy), hasta = new Date(hoy);

            if (valor === 'hoy') {
                // desde = hasta = hoy
            } else if (valor === 'semana') {
                desde.setDate(hoy.getDate() - 6);
            } else if (valor === 'mes') {
                desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            } else if (valor === 'mes_pasado') {
                desde = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
                hasta = new Date(hoy.getFullYear(), hoy.getMonth(), 0);
            } else if (valor === 'anio') {
                desde = new Date(hoy.getFullYear(), 0, 1);
            }

            document.getElementById('desde').value = iso(desde);
            document.getElementById('hasta').value = iso(hasta);
            cargar();
        }

        function min(valor) {
            return valor === null || valor === undefined ? '—' : `${valor} min`;
        }

        function barras(contenedor, filas, etiquetaDe, valorDe, resaltarMaximo) {
            const cont = document.getElementById(contenedor);
            if (!filas.length) {
                cont.innerHTML = '<p class="vacio">Sin datos en este período</p>';
                return;
            }
            const maximo = Math.max(...filas.map(valorDe), 1);
            cont.innerHTML = filas.map(f => {
                const v = valorDe(f);
                const ancho = Math.round((v / maximo) * 100);
                const esPico = resaltarMaximo && v === maximo;
                return `
                    <div class="barra-fila">
                        <span class="barra-fila__etiqueta">${escapar(etiquetaDe(f))}</span>
                        <div class="barra-fila__pista">
                            <div class="barra-fila__valor ${esPico ? 'pico' : ''}" style="width:${ancho}%"></div>
                        </div>
                        <span class="barra-fila__num">${v}</span>
                    </div>`;
            }).join('');
        }

        function pintar(d) {
            const t = d.totales;

            const atendidosPct = t.emitidos ? Math.round(t.atendidos * 100 / t.emitidos) : 0;
            const abandonoPct = t.emitidos ? Math.round(t.sin_atender * 100 / t.emitidos) : 0;

            document.getElementById('kpis').innerHTML = `
                <div class="kpi">
                    <div class="kpi__valor">${t.emitidos}</div>
                    <div class="kpi__etiqueta">Turnos emitidos</div>
                </div>
                <div class="kpi" style="border-left-color:#10b981">
                    <div class="kpi__valor">${t.atendidos}</div>
                    <div class="kpi__etiqueta">Atendidos</div>
                    <div class="kpi__nota">${atendidosPct}% del total</div>
                </div>
                <div class="kpi" style="border-left-color:#38bdf8">
                    <div class="kpi__valor">${min(t.espera_promedio)}</div>
                    <div class="kpi__etiqueta">Espera promedio</div>
                    <div class="kpi__nota">mediana ${min(t.espera_mediana)} · máx ${min(t.espera_maxima)}</div>
                </div>
                <div class="kpi" style="border-left-color:#a78bfa">
                    <div class="kpi__valor">${min(t.atencion_promedio)}</div>
                    <div class="kpi__etiqueta">Atención promedio</div>
                    <div class="kpi__nota">sobre ${t.muestras_atencion} turnos con registro</div>
                </div>
                <div class="kpi" style="border-left-color:${t.sin_atender ? '#f59e0b' : '#334155'}">
                    <div class="kpi__valor">${t.sin_atender}</div>
                    <div class="kpi__etiqueta">Se fueron sin atender</div>
                    <div class="kpi__nota">${abandonoPct}% del total</div>
                </div>`;

            document.getElementById('avisoTruncado').innerHTML = t.truncado
                ? '<div class="aviso">El período supera el máximo de turnos que se procesan de una vez. Achique el rango para ver números exactos.</div>'
                : '';

            // Horas: solo el rango con actividad, para no llenar de ceros
            const horas = d.por_hora.filter(h => h.turnos > 0);
            barras('porHora', horas,
                h => `${String(h.hora).padStart(2, '0')}:00`,
                h => h.turnos, true);

            const dep = document.getElementById('porDepartamento');
            dep.innerHTML = d.por_departamento.length ? `
                <table>
                    <thead><tr>
                        <th>Departamento</th><th class="num">Turnos</th>
                        <th class="num">Espera</th><th class="num">Atención</th>
                    </tr></thead>
                    <tbody>${d.por_departamento.map(x => `
                        <tr>
                            <td><span class="punto" style="background:${escapar(x.color)}"></span>${escapar(x.departamento)}</td>
                            <td class="num">${x.turnos}</td>
                            <td class="num">${min(x.espera_promedio)}</td>
                            <td class="num">${min(x.atencion_promedio)}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>` : '<p class="vacio">Sin datos en este período</p>';

            barras('porDiaSemana', d.por_dia_semana, s => DIAS[s.dia], s => s.turnos, true);

            const ope = document.getElementById('porOperador');
            ope.innerHTML = d.por_operador.length ? `
                <table>
                    <thead><tr>
                        <th>Puesto / Operador</th><th class="num">Turnos atendidos</th>
                        <th class="num">Atención promedio</th>
                    </tr></thead>
                    <tbody>${d.por_operador.map(x => `
                        <tr>
                            <td>${escapar(x.operador)}${x.puesto && x.puesto !== x.operador
                    ? ` <span style="color:var(--text-muted)">· ${escapar(x.puesto)}</span>` : ''}</td>
                            <td class="num">${x.turnos}</td>
                            <td class="num">${min(x.atencion_promedio)}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>` : '<p class="vacio">Todavía no hay turnos atendidos en este período</p>';
        }

        async function cargar() {
            const desde = document.getElementById('desde').value;
            const hasta = document.getElementById('hasta').value;
            const params = new URLSearchParams();
            if (desde) params.set('desde', desde);
            if (hasta) params.set('hasta', hasta);

            document.getElementById('btnExportar').href =
                '/api/reportes/exportar?' + params.toString();

            try {
                const r = await fetch('/api/reportes/resumen?' + params.toString());
                if (!r.ok) {
                    const e = await r.json();
                    alert(e.error || 'No se pudo cargar el reporte');
                    return;
                }
                pintar(await r.json());
            } catch (e) {
                console.error(e);
                alert('Error al cargar el tablero');
            }
        }

        aplicarAtajo('mes');
    </script>
</body>

</html>

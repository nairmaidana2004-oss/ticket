<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema de Tickets</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem 2rem;
            background: var(--bg-card);
            border-radius: 15px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
        }

        .form-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
            height: fit-content;
        }

        .form-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .form-group select option {
            background: var(--bg-dark);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .list-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .list-header h2 {
            font-size: 1.3rem;
            color: var(--text-secondary);
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            text-align: left;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .users-table th:first-child {
            border-radius: 10px 0 0 10px;
        }

        .users-table th:last-child {
            border-radius: 0 10px 10px 0;
        }

        .users-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .users-table tr:hover td {
            background: rgba(99, 102, 241, 0.1);
        }

        .btn-action {
            padding: 0.5rem 0.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.2);
            color: var(--info);
        }

        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .btn-toggle {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .btn-toggle:hover {
            background: rgba(245, 158, 11, 0.3);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .badge-admin {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .badge-operador {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .badge-activo {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .badge-inactivo {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .password-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>👤 Gestión de Usuarios</h1>
            <a href="/admin" class="btn-back">
                ← Volver al Panel
            </a>
        </header>

        <main class="main-grid">
            <section class="form-section">
                <h2 id="formTitle">➕ Nuevo Usuario</h2>
                <form id="userForm">
                    <input type="hidden" id="userId" value="">

                    <div class="form-group">
                        <label for="username">Usuario *</label>
                        <input type="text" id="username" placeholder="Ej: operador1" required>
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" placeholder="Nombre del usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña *</label>
                        <input type="password" id="password" placeholder="••••••••">
                        <p class="password-hint" id="passwordHint">Mínimo 6 caracteres</p>
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol *</label>
                        <select id="rol" required>
                            <option value="operador">Operador</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group" id="puestoGroup">
                        <label for="puesto">Puesto / Ventanilla</label>
                        <input type="text" id="puesto" placeholder="Ej: Puesto 1, Ventanilla A">
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="activo" checked>
                            <label for="activo" style="margin: 0;">Usuario Activo</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <div class="list-header">
                    <h2>📑 Usuarios del Sistema</h2>
                </div>

                <div id="usersContainer">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Rol</th>
                                <th>Puesto</th>
                                <th>Estado</th>
                                <th>Último Acceso</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        let usuarios = [];
        let editando = false;

        document.addEventListener('DOMContentLoaded', () => {
            cargarUsuarios();
        });

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await guardarUsuario();
        });

        async function cargarUsuarios() {
            try {
                const response = await fetch('/api/usuarios');
                usuarios = await response.json();
                renderizarUsuarios(usuarios);
            } catch (error) {
                console.error('Error al cargar usuarios:', error);
                mostrarToast('Error al cargar usuarios', 'error');
            }
        }

        function renderizarUsuarios(lista) {
            const tbody = document.getElementById('usersTableBody');

            if (lista.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <div class="icon">👤</div>
                                <p>No hay usuarios registrados</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = lista.map(user => {
                const ultimoAcceso = user.ultimo_acceso
                    ? new Date(user.ultimo_acceso).toLocaleString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })
                    : 'Nunca';

                return `
                    <tr>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.nombre}</td>
                        <td>
                            <span class="badge badge-${user.rol}">${user.rol === 'admin' ? '👑 Admin' : '🖥️ Operador'}</span>
                        </td>
                        <td>${user.puesto || '-'}</td>
                        <td>
                            <span class="badge badge-${user.activo ? 'activo' : 'inactivo'}">
                                ${user.activo ? 'Activo' : 'Inactivo'}
                            </span>
                        </td>
                        <td>${ultimoAcceso}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editarUsuario(${user.id})">✏️</button>
                            <button class="btn-action btn-toggle" onclick="toggleUsuario(${user.id})">${user.activo ? '🔒' : '🔓'}</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function guardarUsuario() {
            const id = document.getElementById('userId').value;
            const password = document.getElementById('password').value;

            // Validar contraseña solo si es nuevo usuario o si se está cambiando
            if (!id && password.length < 6) {
                mostrarToast('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            const data = {
                username: document.getElementById('username').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                rol: document.getElementById('rol').value,
                puesto: document.getElementById('puesto').value.trim(),
                activo: document.getElementById('activo').checked
            };

            if (password) {
                data.password = password;
            }

            try {
                const url = id ? `/api/usuarios/${id}` : '/api/usuarios';
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Error al guardar');
                }

                mostrarToast(id ? 'Usuario actualizado' : 'Usuario creado', 'success');
                limpiarFormulario();
                cargarUsuarios();
            } catch (error) {
                mostrarToast(error.message, 'error');
            }
        }

        function editarUsuario(id) {
            const user = usuarios.find(u => u.id === id);
            if (!user) return;

            editando = true;
            document.getElementById('userId').value = user.id;
            document.getElementById('username').value = user.username;
            document.getElementById('nombre').value = user.nombre;
            document.getElementById('password').value = '';
            document.getElementById('rol').value = user.rol;
            document.getElementById('puesto').value = user.puesto || '';
            document.getElementById('activo').checked = user.activo;

            document.getElementById('formTitle').textContent = '✏️ Editar Usuario';
            document.getElementById('passwordHint').textContent = 'Dejar vacío para mantener contraseña actual';
            document.getElementById('password').required = false;
            document.getElementById('username').focus();
        }

        async function toggleUsuario(id) {
            const user = usuarios.find(u => u.id === id);
            if (!user) return;

            const accion = user.activo ? 'desactivar' : 'activar';
            if (!confirm(`¿Estás seguro de ${accion} este usuario?`)) return;

            try {
                const response = await fetch(`/api/usuarios/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ activo: !user.activo })
                });

                if (!response.ok) {
                    throw new Error('Error al actualizar');
                }

                mostrarToast(`Usuario ${user.activo ? 'desactivado' : 'activado'}`, 'success');
                cargarUsuarios();
            } catch (error) {
                mostrarToast(error.message, 'error');
            }
        }

        function limpiarFormulario() {
            editando = false;
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('formTitle').textContent = '➕ Nuevo Usuario';
            document.getElementById('passwordHint').textContent = 'Mínimo 6 caracteres';
            document.getElementById('password').required = true;
            document.getElementById('activo').checked = true;
        }

        function mostrarToast(mensaje, tipo) {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.textContent = mensaje;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>

</html>

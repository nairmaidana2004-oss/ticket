<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Tickets - Sistema de Tickets</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem 2rem;
            background: var(--bg-card);
            border-radius: 15px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .filters-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-card);
            border-radius: 15px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-group select option {
            background: var(--bg-dark);
        }

        .btn-filter {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-end;
            transition: all 0.3s ease;
        }

        .btn-filter:hover {
            background: var(--primary-dark);
        }

        .btn-reset {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-end;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .stat-card__value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card__label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .stat-card.total .stat-card__value {
            color: var(--info);
        }

        .stat-card.pendientes .stat-card__value {
            color: var(--warning);
        }

        .stat-card.atendidos .stat-card__value {
            color: var(--success);
        }

        .table-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .table-header h2 {
            font-size: 1.3rem;
            color: var(--text-secondary);
        }

        .tickets-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tickets-table th {
            text-align: left;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tickets-table th:first-child {
            border-radius: 10px 0 0 10px;
        }

        .tickets-table th:last-child {
            border-radius: 0 10px 10px 0;
        }

        .tickets-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tickets-table tr:hover td {
            background: rgba(99, 102, 241, 0.1);
        }

        .ticket-numero {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 8px;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .badge-pendiente {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .badge-llamado {
            background: rgba(59, 130, 246, 0.2);
            color: var(--info);
        }

        .badge-finalizado {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
            }

            .filters-bar {
                flex-direction: column;
            }

            .tickets-table {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>📜 Histórico de Tickets</h1>
            <div class="header-actions">
                <a href="/admin" class="btn-back">
                    ← Volver al Panel
                </a>
            </div>
        </header>

        <!-- Filtros -->
        <div class="filters-bar">
            <div class="filter-group">
                <label>Desde</label>
                <input type="date" id="fechaDesde">
            </div>
            <div class="filter-group">
                <label>Hasta</label>
                <input type="date" id="fechaHasta">
            </div>
            <div class="filter-group">
                <label>Departamento</label>
                <select id="departamentoFilter">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Estado</label>
                <select id="estadoFilter">
                    <option value="">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Llamado">Llamado</option>
                    <option value="Finalizado">Finalizado</option>
                </select>
            </div>
            <button class="btn-filter" onclick="aplicarFiltros()">🔍 Buscar</button>
            <button class="btn-reset" onclick="limpiarFiltros()">⟲ Limpiar</button>
        </div>

        <!-- Resumen estadístico -->
        <div class="stats-summary">
            <div class="stat-card total">
                <div class="stat-card__value" id="totalTickets">0</div>
                <div class="stat-card__label">Total Encontrados</div>
            </div>
            <div class="stat-card pendientes">
                <div class="stat-card__value" id="ticketsPendientes">0</div>
                <div class="stat-card__label">Pendientes</div>
            </div>
            <div class="stat-card atendidos">
                <div class="stat-card__value" id="ticketsFinalizados">0</div>
                <div class="stat-card__label">Finalizados</div>
            </div>
        </div>

        <!-- Tabla de histórico -->
        <section class="table-section">
            <div class="table-header">
                <h2>📋 Listado de Tickets</h2>
                <span id="resultCount" style="color: var(--text-secondary);"></span>
            </div>

            <table class="tickets-table">
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Departamento</th>
                        <th>Estado</th>
                        <th>Socio</th>
                        <th>Operador</th>
                        <th>Creación</th>
                        <th>Atención</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody">
                </tbody>
            </table>

            <!-- Paginación -->
            <div class="pagination" id="pagination">
            </div>
        </section>
    </div>

    <script>
        let tickets = [];
        let departamentos = [];
        let currentPage = 1;
        const ticketsPerPage = 20;

        document.addEventListener('DOMContentLoaded', async () => {
            // Establecer fecha por defecto (hoy)
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaDesde').value = hoy;
            document.getElementById('fechaHasta').value = hoy;

            await cargarDepartamentos();
            await cargarTickets();
        });

        async function cargarDepartamentos() {
            try {
                const response = await fetch('/api/departamentos');
                departamentos = await response.json();

                const select = document.getElementById('departamentoFilter');
                departamentos.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = `${dept.icono} ${dept.nombre}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error cargando departamentos:', error);
            }
        }

        async function cargarTickets() {
            try {
                const params = new URLSearchParams();

                const fechaDesde = document.getElementById('fechaDesde').value;
                const fechaHasta = document.getElementById('fechaHasta').value;
                const departamento = document.getElementById('departamentoFilter').value;
                const estado = document.getElementById('estadoFilter').value;

                if (fechaDesde) params.append('fecha_desde', fechaDesde);
                if (fechaHasta) params.append('fecha_hasta', fechaHasta);
                if (departamento) params.append('departamento_id', departamento);
                if (estado) params.append('estado', estado);

                const response = await fetch(`/api/tickets/historico?${params.toString()}`);
                tickets = await response.json();

                actualizarEstadisticas();
                renderizarTickets();
            } catch (error) {
                console.error('Error cargando tickets:', error);
            }
        }

        function actualizarEstadisticas() {
            const total = tickets.length;
            const pendientes = tickets.filter(t => t.estado === 'Pendiente').length;
            const finalizados = tickets.filter(t => t.estado === 'Finalizado').length;

            document.getElementById('totalTickets').textContent = total;
            document.getElementById('ticketsPendientes').textContent = pendientes;
            document.getElementById('ticketsFinalizados').textContent = finalizados;
        }

        function renderizarTickets() {
            const tbody = document.getElementById('ticketsTableBody');
            const startIndex = (currentPage - 1) * ticketsPerPage;
            const endIndex = startIndex + ticketsPerPage;
            const ticketsPagina = tickets.slice(startIndex, endIndex);

            document.getElementById('resultCount').textContent =
                `Mostrando ${startIndex + 1}-${Math.min(endIndex, tickets.length)} de ${tickets.length}`;

            if (tickets.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <div class="icon">🔍</div>
                                <p>No se encontraron tickets con los filtros aplicados</p>
                            </div>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = ticketsPagina.map(ticket => {
                const fechaCreacion = new Date(ticket.fecha_creacion).toLocaleString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const fechaAtencion = ticket.fecha_atencion
                    ? new Date(ticket.fecha_atencion).toLocaleString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    })
                    : '-';

                const estadoClass = {
                    'Pendiente': 'pendiente',
                    'Llamado': 'llamado',
                    'Finalizado': 'finalizado'
                }[ticket.estado] || '';

                let socioInfo = '-';
                if (ticket.nombre_socio || ticket.dni_socio) {
                    socioInfo = [ticket.nombre_socio, ticket.dni_socio ? `DNI: ${ticket.dni_socio}` : '']
                        .filter(Boolean).join(' / ');
                }

                return `
                    <tr>
                        <td>
                            <span class="ticket-numero" style="background: ${ticket.departamento?.color}30; color: ${ticket.departamento?.color};">
                                ${ticket.departamento?.icono || '🎫'} ${ticket.codigo_completo}
                            </span>
                        </td>
                        <td>${ticket.departamento?.nombre || '-'}</td>
                        <td><span class="badge badge-${estadoClass}">${ticket.estado}</span></td>
                        <td>${socioInfo}</td>
                        <td>${ticket.usuario || 'Sistema'}</td>
                        <td>${fechaCreacion}</td>
                        <td>${fechaAtencion}</td>
                    </tr>
                `;
            }).join('');

            renderizarPaginacion();
        }

        function renderizarPaginacion() {
            const totalPages = Math.ceil(tickets.length / ticketsPerPage);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';

            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="irAPagina(1)">⟪</button>`;
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="irAPagina(${currentPage - 1})">◀</button>`;

            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="irAPagina(${i})">${i}</button>`;
            }

            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="irAPagina(${currentPage + 1})">▶</button>`;
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="irAPagina(${totalPages})">⟫</button>`;

            pagination.innerHTML = html;
        }

        function irAPagina(pagina) {
            currentPage = pagina;
            renderizarTickets();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function aplicarFiltros() {
            currentPage = 1;
            cargarTickets();
        }

        function limpiarFiltros() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaDesde').value = hoy;
            document.getElementById('fechaHasta').value = hoy;
            document.getElementById('departamentoFilter').value = '';
            document.getElementById('estadoFilter').value = '';
            currentPage = 1;
            cargarTickets();
        }
    </script>
</body>

</html>
